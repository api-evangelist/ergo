name: Ergo
description: 'Ergo (ergo Offers, Inc.) is a New York-based e-commerce pricing company
  that lets online shoppers name their own price. Its flagship product is a Shopify
  app that adds a "Make an Offer with ergo" button to product pages: a customer submits
  the price they are willing to pay and how long they are willing to wait, and the
  merchant accepts or rejects the offer from a backend dashboard. Beyond bartering,
  Ergo captures true willingness-to-pay data and turns it into pricing analytics and
  a price-discovery and optimization tool, helping retailers clear excess inventory
  and reduce blanket discounting. Founded and led by CEO Claire Stepanek (previously
  supply chain at Apple), Ergo raised a $1.5M pre-seed round in October 2023 led by
  Anthemis with Wischoff Ventures. Ergo does not currently publish a public developer
  API; this profile captures its company identity.'
